[package]
name = "muz"
version = "0.0.1"
edition = "2024"

[dependencies]
arrayvec = "0.7.6"
clap = { version = "4.5.47", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
json5 = "1.3.1"
libloading = "0.8.9"
notify = "8.2.0"
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
rtrb = "0.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tempfile = "3.21.0"
vst3 = "0.3.0"
anyhow = "1.0"
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
hound = "3.5"
