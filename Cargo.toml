[package]
name = "muz"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:clap", "dep:cpal", "dep:libloading", "dep:notify", "dep:rtrb", "dep:tempfile", "dep:vst3", "dep:ebur128", "dep:ctrlc", "dep:clap-sys", "dep:x11rb", "dep:parking_lot"]

[[bin]]
name = "muz"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
arrayvec = "0.7.6"
clap = { version = "4.5.47", features = ["derive"], optional = true }
cpal = { version = "0.18.2", features = ["pipewire"], optional = true }
json5 = "1.3.1"
libloading = { version = "0.8.9", optional = true }
notify = { version = "8.2.0", optional = true }
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
rtrb = { version = "0.4.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tempfile = { version = "3.21.0", optional = true }
vst3 = { version = "0.3.0", optional = true }
anyhow = "1.0"
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
hound = "3.5"
ebur128 = { version = "0.1.10", optional = true }
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }
claxon = "0.4.3"
clap-sys = { version = "0.5.0", optional = true }
x11rb = { version = "0.13.2", optional = true }
parking_lot = { version = "0.12.5", optional = true }

[dev-dependencies]
tempfile = "3.21.0"
